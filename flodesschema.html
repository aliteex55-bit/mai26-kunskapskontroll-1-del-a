<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inköpslistan – flöde och kod</title>
<style>
:root {
  --bg: #ffffff; --panel: #f6f7f9; --text: #1a1a18; --muted: #5f6368; --line: #c9ccd1;
  --accent: #2f6df6; --accent-soft: #e6eefe; --warn: #b8860b; --warn-soft: #fff7e0;
  --err: #c0392b; --err-soft: #fdecec; --code-bg: #fbfbfc; --hl: #fff3bf;
  --c-kw: #0b55c8; --c-str: #a3320b; --c-com: #5d7a5d; --c-num: #0e7c6b; --c-type: #267f99;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181c; --panel: #1e2126; --text: #e8e8e6; --muted: #a2a6ad; --line: #3a3f47;
    --accent: #5b8cff; --accent-soft: #223050; --warn: #e0b040; --warn-soft: #3a3118;
    --err: #ff7b6b; --err-soft: #40201d; --code-bg: #1a1c21; --hl: #4a4116;
    --c-kw: #7fb0ff; --c-str: #f0a37f; --c-com: #86a886; --c-num: #6fd6c4; --c-type: #6fc3df;
  }
}
:root[data-theme="dark"] {
  --bg: #16181c; --panel: #1e2126; --text: #e8e8e6; --muted: #a2a6ad; --line: #3a3f47;
  --accent: #5b8cff; --accent-soft: #223050; --warn: #e0b040; --warn-soft: #3a3118;
  --err: #ff7b6b; --err-soft: #40201d; --code-bg: #1a1c21; --hl: #4a4116;
  --c-kw: #7fb0ff; --c-str: #f0a37f; --c-com: #86a886; --c-num: #6fd6c4; --c-type: #6fc3df;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, Arial, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; font-weight: 600; }
header .hint { color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; }
button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: calc(100% - 55px); }
#chart { padding: 12px 16px; overflow: auto; border-right: 1px solid var(--line); }
#chart svg { width: 100%; height: auto; display: block; font: 13px "Segoe UI", system-ui, Arial, sans-serif; }
#panel { padding: 16px 20px 40px; overflow: auto; }
.ln { stroke: var(--muted); stroke-width: 1.5; }
#arr path { fill: var(--muted); }
.lbl { fill: var(--muted); font-size: 12px; }
.node { cursor: pointer; }
.node rect, .node polygon { fill: var(--bg); stroke: var(--muted); stroke-width: 1.5; }
.node text { fill: var(--text); pointer-events: none; }
.node:hover rect, .node:hover polygon { stroke: var(--accent); stroke-width: 2.5; }
.k-pill rect { fill: var(--panel); }
.k-diamond polygon { fill: var(--warn-soft); stroke: var(--warn); }
.k-err rect { fill: var(--err-soft); stroke: var(--err); }
.k-loop rect { fill: var(--panel); stroke-dasharray: 5 4; }
.node.sel rect, .node.sel polygon { stroke: var(--accent); stroke-width: 4; fill: var(--accent-soft); }
.node.sel text { font-weight: 600; }
#panel h2 { font-size: 22px; margin: 0 0 6px; }
.say { background: var(--accent-soft); border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 4px; margin: 10px 0 18px; font-size: 16px; }
.say b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
.ref { margin: 0 0 26px; }
.ref h3 { font-size: 16px; margin: 0 0 2px; }
.ref .where { color: var(--muted); font-size: 13px; font-family: Consolas, "Cascadia Mono", monospace; }
.ref .what { margin: 6px 0 8px; }
.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; }
.code table { border-collapse: collapse; font: 13px/1.45 Consolas, "Cascadia Mono", "Courier New", monospace; min-width: 100%; }
.code td { padding: 0 10px; white-space: pre; vertical-align: top; }
.code td.n { color: var(--muted); text-align: right; user-select: none; border-right: 1px solid var(--line); width: 1%; }
.code tr.hl td { background: var(--hl); }
.code tr.mark td.n { color: var(--accent); font-weight: 700; }
.t-kw { color: var(--c-kw); } .t-str { color: var(--c-str); } .t-com { color: var(--c-com); font-style: italic; }
.t-num { color: var(--c-num); } .t-type { color: var(--c-type); }
ul.pts { list-style: none; margin: 8px 0 0; padding: 0; }
ul.pts li { display: flex; gap: 10px; padding: 5px 8px; border-radius: 4px; cursor: pointer; }
ul.pts li:hover, ul.pts li.on { background: var(--hl); }
ul.pts .ln-no { font-family: Consolas, monospace; color: var(--accent); font-weight: 700; min-width: 64px; }
.empty { color: var(--muted); font-size: 17px; margin-top: 40px; }
.nav { display: flex; gap: 8px; align-items: center; }
.pos { color: var(--muted); font-size: 13px; min-width: 60px; text-align: center; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; height: auto; }
  #chart { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>

<script id="data" type="application/json">{"nodes":{"add":{"name":"Lägg till varan","refs":[{"code":"names.Add(input); // Lägger namnet sist i namnlistan.\nprices.Add(price); // Lägger priset sist i prislistan.","file":"Inkopslista.cs","from":123,"points":[{"line":123,"text":"Namnet läggs sist i namnlistan."},{"line":124,"text":"Priset läggs sist i prislistan, på samma index som namnet."}],"title":"Tillägget","to":124,"what":"Add lägger alltid till sist i listan."}],"say":"Namnet och priset läggs sist i var sin lista. Eftersom båda läggs sist hamnar de på samma index."},"ask":{"name":"Fråga efter priset","refs":[{"code":"Console.Write(\"Ange pris i hela kronor: \"); // Frågar efter varans pris.","file":"Inkopslista.cs","from":119,"points":[],"title":"Frågan","to":119,"what":"Priset ska anges i hela kronor."}],"say":"Texten var inte ett nummer, så den är namnet på en ny vara. Programmet frågar vad varan kostar."},"check":{"name":"Är det ett nummer?","refs":[{"code":"string numberText = input.Trim(); // Tar bort mellanslag runt ett möjligt nummer.\n\nif (numberText.StartsWith(\"+\") || numberText.StartsWith(\"-\")) // Ett heltal kan börja med plus eller minus.\n{\n    numberText = numberText.Substring(1); // Tar bort tecknet inför kontrollen av siffrorna.\n}\n\nbool isNumber = numberText.Length > 0; // Ett nummer måste innehålla minst en siffra.\n\nforeach (char character in numberText) // Kontrollerar varje tecken, även i mycket stora nummer.\n{\n    if (character < '0' || character > '9') // Kontrollerar om tecknet inte är en siffra.\n    {\n        isNumber = false; // Text med andra tecken behandlas som ett varunamn.\n    }\n}","file":"Inkopslista.cs","from":87,"points":[{"line":87,"text":"Mellanslag runt texten tas bort."},{"line":89,"text":"Ett heltal får börja med plus eller minus, så det tecknet tas bort före kontrollen."},{"line":94,"text":"Ett nummer måste ha minst en siffra."},{"line":96,"text":"Går igenom texten tecken för tecken."},{"line":98,"text":"Ligger tecknet utanför 0 till 9 är det ingen siffra."},{"line":100,"text":"Då behandlas texten som ett varunamn."}],"title":"Kontrollen tecken för tecken","to":102,"what":"Kontrollen fungerar även för mycket långa nummer, som inte ryms i en int."}],"say":"Programmet tittar på varje tecken. Bara siffror, eventuellt med plus eller minus först, räknas som ett nummer. Allt annat är ett varunamn."},"ddyrast":{"name":"Skrev användaren dyrast?","refs":[{"code":"if (input.Trim().ToLower() == \"dyrast\") // Asked for: the optional extra where the word \"dyrast\" shows the most expensive item.","file":"Inkopslista.cs","from":36,"points":[],"title":"Jämförelsen","to":36,"what":"Trim tar bort mellanslag runt texten och ToLower gör alla bokstäver små. Därför fungerar också \"DYRAST\" och \" dyrast \"."}],"say":"Extrafunktion. Ordet dyrast är ett kommando, inte en vara."},"dempty":{"name":"Skrev användaren ingenting?","refs":[{"code":"if (string.IsNullOrWhiteSpace(input)) // Kontrollerar om användaren skrev en tom rad eller bara mellanslag.","file":"Inkopslista.cs","from":30,"points":[],"title":"Kontrollen","to":30,"what":"IsNullOrWhiteSpace är sant för tom text och för text som bara innehåller mellanslag."}],"say":"En tom rad, eller bara mellanslag, är varken en vara eller ett nummer. Då ber programmet om något nytt i stället för att lägga till en tom vara."},"dexists":{"name":"Finns numret i listan?","refs":[{"code":"if (int.TryParse(input, out int number) && number >= 1 && number <= names.Count) // Numret måste rymmas i int och finnas i listan.","file":"Inkopslista.cs","from":106,"points":[{"line":106,"text":"TryParse försöker göra om texten till en int utan att krascha. Går det inte blir svaret falskt."}],"title":"Villkoret","to":106,"what":"&& betyder \"och\": alla tre villkoren måste stämma."}],"say":"Numret måste gå att läsa som en int och ligga mellan 1 och antalet varor. Annars finns ingen sådan vara."},"dexit":{"name":"Ska programmet avslutas?","refs":[{"code":"if (input == null || input == \"avsluta\") // Kontrollerar om programmet ska avslutas.\n{\n    break; // Avslutar loopen.\n}","file":"Inkopslista.cs","from":25,"points":[{"line":25,"text":"Inmatningen tog slut, till exempel om fönstret stängs."},{"line":25,"text":"Användaren skrev ordet avsluta."},{"line":27,"text":"break hoppar ut ur while-loopen."}],"title":"Villkoret för att avsluta","to":28,"what":"|| betyder \"eller\": det räcker att ett av villkoren stämmer."}],"say":"Om användaren skriver avsluta, eller om inmatningen tar slut (null), lämnar programmet loopen."},"dint":{"name":"Är priset ett heltal?","refs":[{"code":"if (int.TryParse(Console.ReadLine(), out int price)) // Kontrollerar att priset är ett heltal.","file":"Inkopslista.cs","from":121,"points":[],"title":"Kontrollen","to":121,"what":"Läser svaret och kontrollerar det i samma rad. out int price får värdet om det gick."}],"say":"int.TryParse försöker läsa svaret som ett heltal. Lyckas det läggs varan till, annars inte."},"dnum":{"name":"Nummer eller vara?","refs":[{"code":"if (isNumber) // Heltalstext används för borttagning, även om talet är för stort för int.","file":"Inkopslista.cs","from":104,"points":[],"title":"Valet","to":104,"what":"isNumber sattes i steget innan."}],"say":"Här delar sig flödet: ett nummer betyder ta bort, allt annat betyder lägg till en vara."},"dsortera":{"name":"Skrev användaren sortera?","refs":[{"code":"if (input.Trim().ToLower() == \"sortera\") // Asked for: the optional extra that sorts the list by price, cheapest first.","file":"Inkopslista.cs","from":60,"points":[],"title":"Jämförelsen","to":60,"what":"Samma teknik som för dyrast: Trim och ToLower gör att små skillnader i hur ordet skrivs inte spelar roll."}],"say":"Extrafunktion. Ordet sortera är ett kommando, inte en vara."},"dyrast":{"name":"Hitta den dyraste varan","refs":[{"code":"if (names.Count == 0) // An empty list has no most expensive item.\n{\n    Console.WriteLine(\"Listan är tom.\"); // Tells the user instead of crashing on an empty list.\n}\nelse // The list has at least one item.\n{\n    int maxIndex = 0; // Starts by assuming the first item is the most expensive.\n\n    for (int i = 1; i < prices.Count; i++) // Compares every other price with the highest so far.\n    {\n        if (prices[i] > prices[maxIndex]) // A higher price becomes the new maximum.\n        {\n            maxIndex = i; // Remembers where the most expensive item is.\n        }\n    }\n\n    Console.WriteLine($\"Dyrast: {names[maxIndex]} - {prices[maxIndex]} kr\"); // Name and price come from the same index, so they belong together.\n}\n\ncontinue; // Shows the list again without adding \"dyrast\" as an item.","file":"Inkopslista.cs","from":38,"points":[{"line":38,"text":"En tom lista har ingen dyraste vara, så programmet säger till i stället för att krascha."},{"line":44,"text":"Utgångsläget: den första varan antas vara dyrast."},{"line":46,"text":"Börjar på 1, eftersom vara 0 redan är den vi jämför med."},{"line":48,"text":"Är den här varan dyrare än den dyraste hittills?"},{"line":50,"text":"Då blir den här varan den nya dyraste."},{"line":54,"text":"Namn och pris hämtas från samma index."},{"line":57,"text":"Ordet dyrast läggs inte till som vara. Listan visas igen."}],"title":"Letandet efter det högsta priset","to":57,"what":"Samma index används för namn och pris, så rätt namn skrivs ut med rätt pris."}],"say":"Programmet antar först att den första varan är dyrast och jämför sedan med varje annan vara. Är en vara dyrare kommer programmet ihåg dess plats."},"empty":{"name":"Be om något att göra","refs":[{"code":"Console.WriteLine(\"Skriv ett varunamn eller ett nummer.\"); // Ber användaren skriva något.\ncontinue; // Börjar nästa varv i loopen.","file":"Inkopslista.cs","from":32,"points":[{"line":33,"text":"Resten av loopen hoppas över, och listan visas igen."}],"title":"Meddelandet och continue","to":33,"what":"continue hoppar direkt till nästa varv i loopen."}],"say":"Programmet säger till och börjar om loopen, så listan visas igen."},"end":{"name":"Programmet avslutas","refs":[{"code":"break; // Avslutar loopen.","file":"Inkopslista.cs","from":27,"points":[],"title":"break","to":27,"what":"Efter break fortsätter körningen efter loopens sista måsvinge, och där slutar filen."}],"say":"När loopen är bruten finns ingen mer kod att köra, och programmet tar slut."},"errnum":{"name":"Numret finns inte","refs":[{"code":"else // Körs om numret inte finns i listan.\n{\n    Console.WriteLine(\"Det numret finns inte i listan.\"); // Visar ett felmeddelande.\n}","file":"Inkopslista.cs","from":112,"points":[],"title":"Felmeddelandet","to":115,"what":"else körs när villkoret i if inte stämde."}],"say":"I stället för att krascha säger programmet till, och listan visas igen."},"errprice":{"name":"Priset var inte ett heltal","refs":[{"code":"else // Körs om priset inte går att läsa som ett heltal.\n{\n    Console.WriteLine(\"Priset måste vara ett heltal. Varan lades inte till.\"); // Förklarar felet.\n}","file":"Inkopslista.cs","from":126,"points":[],"title":"Felmeddelandet","to":129,"what":"Varan läggs inte till i någon av listorna, så de förblir lika långa."}],"say":"Varan läggs inte till, och programmet förklarar varför. Ingenting kraschar."},"loop":{"name":"Loopen börjar om","refs":[{"code":"while (true) // Upprepar programmet tills användaren avslutar.\n{","file":"Inkopslista.cs","from":10,"points":[],"title":"Loopen","to":11,"what":"while (true) upprepas för alltid. Den enda vägen ut är break."},{"code":"}","file":"Inkopslista.cs","from":131,"points":[],"title":"Loopens slut","to":131,"what":"När körningen når den här måsvingen hoppar den tillbaka till while-raden."}],"say":"Allt ligger i en while (true)-loop. Efter varje val börjar loopen om och listan visas igen, tills användaren skriver avsluta."},"read":{"name":"Läs inmatningen","refs":[{"code":"Console.Write(\"Skriv en vara, ett nummer för att ta bort eller avsluta: \"); // Ber om ett val.\nstring? input = Console.ReadLine(); // Läser användarens text. ? tillåter null om inmatningen tar slut.","file":"Inkopslista.cs","from":22,"points":[{"line":23,"text":"Läser en hel rad som användaren skriver."},{"line":23,"text":"Frågetecknet betyder att värdet kan vara null, vilket händer om inmatningen tar slut."}],"title":"Frågan och inläsningen","to":23,"what":"Console.Write skriver frågan utan radbrytning, så svaret hamnar på samma rad."}],"say":"Programmet frågar vad användaren vill göra och läser en rad text. Allt som händer sedan beror på vad som skrevs."},"remove":{"name":"Ta bort varan","refs":[{"code":"int index = number - 1; // Listans index börjar på 0, men numreringen börjar på 1.\nnames.RemoveAt(index); // Tar bort varans namn.\nprices.RemoveAt(index); // Tar bort priset på samma plats så att listorna stämmer.","file":"Inkopslista.cs","from":108,"points":[{"line":108,"text":"Gör om användarens nummer till listans index."},{"line":109,"text":"Tar bort namnet."},{"line":110,"text":"Tar bort priset på samma plats. Annars skulle listorna hamna i otakt."}],"title":"Borttagningen","to":110,"what":"Användaren ser nummer från 1, men listan räknar från 0."}],"say":"Varan tas bort ur båda listorna på samma plats, så att namn och pris fortsätter höra ihop."},"show":{"name":"Visa listan och totalsumman","refs":[{"code":"Console.WriteLine(\"\\nInköpslista:\"); // Visar en rubrik före listan.\nlong total = 0; // Börjar summan på noll. long rymmer summan av många stora priser.\n\nfor (int i = 0; i < names.Count; i++) // Går igenom alla varor i listan.\n{\n    Console.WriteLine($\"{i + 1}. {names[i]} - {prices[i]} kr\"); // Visar nummer, namn och pris.\n    total += prices[i]; // Lägger varans pris till totalsumman.\n}\n\nConsole.WriteLine($\"Totalt: {total} kr\"); // Visar summan av alla priser.","file":"Inkopslista.cs","from":12,"points":[{"line":13,"text":"Summan börjar på noll. long rymmer större tal än int, så summan inte kan bli för stor."},{"line":15,"text":"i går från 0 till sista varan. names.Count är antalet varor."},{"line":17,"text":"Index börjar på 0, men användaren ska se nummer från 1. Därför skrivs i + 1 ut."},{"line":18,"text":"Varje pris läggs till summan."},{"line":21,"text":"Summan skrivs ut efter listan."}],"title":"Utskriften","to":21,"what":"En for-loop går igenom alla varor och lägger samtidigt ihop priserna."}],"say":"Varje varv i loopen börjar med att hela listan skrivs ut, numrerad från 1, och sist totalsumman. Därför ser användaren alltid aktuell lista."},"sortera":{"name":"Sortera listan efter pris","refs":[{"code":"for (int i = 0; i < prices.Count; i++) // Asked for in steps: repeats the \"move the cheapest first\" step for every position i.\n{\n    int minIndex = i; // Starts by assuming the item at position i is the cheapest of the rest.\n\n    for (int j = i + 1; j < prices.Count; j++) // Only looks at the items after position i; the ones before are already sorted.\n    {\n        if (prices[j] < prices[minIndex]) // A lower price becomes the new cheapest.\n        {\n            minIndex = j; // Remembers where the cheapest item is.\n        }\n    }\n\n    int tempPrice = prices[i]; // Keeps the price at position i while the swap happens.\n    prices[i] = prices[minIndex]; // Moves the cheapest remaining price to position i.\n    prices[minIndex] = tempPrice; // Puts the old price where the cheapest one was.\n\n    string tempName = names[i]; // Swaps the names in exactly the same way,\n    names[i] = names[minIndex]; // so that names[i] still belongs to prices[i]\n    names[minIndex] = tempName; // and the two lists stay in sync.\n}\n\nConsole.WriteLine(\"Listan är sorterad efter pris, billigast först.\"); // Confirms the sort; the loop then shows the new order.\ncontinue; // Shows the list again without adding \"sortera\" as an item.","file":"Inkopslista.cs","from":62,"points":[{"line":62,"text":"Plats för plats: först plats 0, sedan 1 och så vidare."},{"line":64,"text":"Utgångsläget: varan som redan står på platsen antas vara billigast."},{"line":66,"text":"Letar bara bland varorna efter platsen. De före är redan sorterade."},{"line":68,"text":"Är den här varan billigare än den billigaste hittills?"},{"line":74,"text":"Ett byte behöver en tillfällig variabel, annars skrivs ett värde över innan det flyttats."},{"line":78,"text":"Namnen byter plats på samma sätt, så names[i] fortfarande hör till prices[i]."},{"line":83,"text":"Bekräftelsen. Listan visas sedan i sin nya ordning."}],"title":"Sorteringen (urvalssortering)","to":84,"what":"Den yttre loopen väljer plats, den inre letar upp den billigaste av resten, och sist byter de plats."}],"say":"För varje plats letar programmet upp den billigaste av de varor som är kvar och flyttar den dit. Namnen flyttas på exakt samma sätt som priserna, så listorna hålls ihop."},"start":{"name":"Start: två tomma listor","refs":[{"code":"List<string> names = new List<string>(); // Sparar varornas namn.\nList<int> prices = new List<int>(); // Sparar priserna på samma index som namnen.","file":"Inkopslista.cs","from":7,"points":[{"line":7,"text":"En lista med text: varornas namn."},{"line":8,"text":"En lista med heltal: priserna, på samma index som namnen."}],"title":"De två parallella listorna","to":8,"what":"names[0] och prices[0] är samma vara, names[1] och prices[1] nästa, och så vidare."}],"say":"Programmet börjar med två tomma listor. Den ena sparar varornas namn, den andra deras priser. Samma plats (index) i båda listorna hör till samma vara."}},"order":["start","show","read","dexit","end","dempty","empty","ddyrast","dyrast","dsortera","sortera","check","dnum","dexists","remove","errnum","ask","dint","add","errprice","loop"]}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var panel = document.getElementById('panel');
  var current = -1;

  var KW = ('break bool char continue else false for foreach if in int long new null out property string true using var while').split(' ');
  var TYPES = ('Console List System Collections Generic').split(' ');

  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // Splits C# code into pieces: [class, text]
  function tokens(code) {
    var out = [], re = /(\/\/[^\n]*)|(\$?"(?:[^"\\\n]|\\.)*")|('(?:[^'\\\n]|\\.)')|([A-Za-z_][A-Za-z0-9_]*)|([0-9]+)|([\s\S])/g, m;
    while ((m = re.exec(code))) {
      if (m[1]) out.push(['t-com', m[1]]);
      else if (m[2]) out.push(['t-str', m[2]]);
      else if (m[3]) out.push(['t-str', m[3]]);
      else if (m[4]) out.push([KW.indexOf(m[4]) >= 0 ? 't-kw' : (TYPES.indexOf(m[4]) >= 0 ? 't-type' : ''), m[4]]);
      else if (m[5]) out.push(['t-num', m[5]]);
      else out.push(['', m[6]]);
    }
    return out;
  }

  function highlightLines(code) {
    var lines = [''];
    tokens(code).forEach(function (t) {
      t[1].split('\n').forEach(function (p, k) {
        if (k > 0) lines.push('');
        if (p.length) lines[lines.length - 1] += t[0] ? '<span class="' + t[0] + '">' + esc(p) + '</span>' : esc(p);
      });
    });
    return lines;
  }

  function render(idx) {
    var id = DATA.order[idx], node = DATA.nodes[id];
    current = idx;
    document.querySelectorAll('.node.sel').forEach(function (e) { e.classList.remove('sel'); });
    var g = document.querySelector('.node[data-id="' + id + '"]');
    if (g) g.classList.add('sel');
    document.getElementById('pos').textContent = (idx + 1) + ' / ' + DATA.order.length;

    var h = '<h2>' + esc(node.name) + '</h2>';
    h += '<div class="say"><b>Enkelt förklarat</b>' + esc(node.say) + '</div>';
    node.refs.forEach(function (r, ri) {
      var marked = {};
      r.points.forEach(function (p) { marked[p.line] = true; });
      h += '<div class="ref" data-ref="' + ri + '"><h3>' + esc(r.title) + '</h3>';
      h += '<div class="where">' + esc(r.file) + ', rad ' + r.from + (r.to > r.from ? '–' + r.to : '') + '</div>';
      h += '<p class="what">' + esc(r.what) + '</p>';
      h += '<div class="code"><table>';
      highlightLines(r.code).forEach(function (ln, k) {
        var no = r.from + k;
        h += '<tr data-line="' + no + '"' + (marked[no] ? ' class="mark"' : '') + '><td class="n">' + no + '</td><td>' + (ln || ' ') + '</td></tr>';
      });
      h += '</table></div>';
      if (r.points.length) {
        h += '<ul class="pts">';
        r.points.forEach(function (p) {
          h += '<li data-line="' + p.line + '" tabindex="0"><span class="ln-no">Rad ' + p.line + '</span><span>' + esc(p.text) + '</span></li>';
        });
        h += '</ul>';
      }
      h += '</div>';
    });
    panel.innerHTML = h;
    panel.scrollTop = 0;
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
  }

  function point(li) {
    var ref = li.closest('.ref'), line = li.getAttribute('data-line');
    ref.querySelectorAll('tr.hl').forEach(function (e) { e.classList.remove('hl'); });
    ref.querySelectorAll('li.on').forEach(function (e) { e.classList.remove('on'); });
    var tr = ref.querySelector('tr[data-line="' + line + '"]');
    if (tr) { tr.classList.add('hl'); tr.scrollIntoView({ block: 'nearest' }); }
    li.classList.add('on');
  }

  function step(d) {
    var n = DATA.order.length;
    render(current < 0 ? 0 : (current + d + n) % n);
  }

  document.querySelectorAll('.node').forEach(function (g) {
    function go() { render(DATA.order.indexOf(g.getAttribute('data-id'))); }
    g.addEventListener('click', go);
    g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
  panel.addEventListener('click', function (e) { var li = e.target.closest('ul.pts li'); if (li) point(li); });
  panel.addEventListener('mouseover', function (e) { var li = e.target.closest('ul.pts li'); if (li) point(li); });
  panel.addEventListener('keydown', function (e) { var li = e.target.closest('ul.pts li'); if (li && e.key === 'Enter') point(li); });
  document.getElementById('prev').addEventListener('click', function () { step(-1); });
  document.getElementById('next').addEventListener('click', function () { step(1); });
  document.addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('.node, ul.pts li')) return;
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  });
  document.getElementById('theme').addEventListener('click', function () {
    var root = document.documentElement, dark = root.getAttribute('data-theme');
    if (!dark) dark = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    root.setAttribute('data-theme', dark === 'dark' ? 'light' : 'dark');
  });

  var start = DATA.order.indexOf(location.hash.slice(1));
  if (start >= 0) render(start);
})();
</script>
